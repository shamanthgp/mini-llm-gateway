version: '3.8'

services:
  gateway:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - GATEWAY_API_KEYS=${GATEWAY_API_KEYS:-}
      - WORKER_SHARED_SECRET=${WORKER_SHARED_SECRET:-secret-placeholder}

  worker:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.worker"]
    depends_on:
      - gateway
    deploy:
      replicas: 3
    environment:
      - WORKER_GATEWAY_URL=http://gateway:8000
      - API_BASE_URL=${API_BASE_URL}
      - API_KEY=${API_KEY}
      - GATEWAY_API_KEYS=${GATEWAY_API_KEYS}
      - WORKER_SHARED_SECRET=${WORKER_SHARED_SECRET}
